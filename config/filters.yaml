# SWE Job Watch - job qualification rules

freshness:
  lookbackHours: 72
  requireOpenJob: true
  allowFirstSeenFallback: true
  useUpdatedAtAsPostedAt: false

location:
  country: US
  allowRemoteUS: true
  allowMultiLocationWithUS: true
  rejectNonUSOnly: true

roles:
  matchMode: contains
  caseSensitive: false

  include:
    - software engineer
    - software development engineer
    - backend engineer
    - back end engineer
    - frontend engineer
    - front end engineer
    - full stack engineer
    - fullstack engineer
    - site reliability engineer
    - distributed engineer
    - software developer
    - developer
    - software
    - distributed systems

  excludeTitles:
    - new grad
    - software engineering manager
    - software development manager
    - test engineer
    - software test
    - qa engineer
    - quality assurance
    - validation engineer
    - firmware engineer
    - embedded software
    - robotics software

  excludeDomains:
    - robotics
    - autonomy
    - controls
    - calibration
    - mapping
    - localization
    - drone
    - flight
    - electrical
    - electronics
    - firmware
    - embedded
    - hardware
    - mechanical
    - manufacturing
    - validation
    - test engineering

seniority:
  exclude:
    - staff
    - senior staff
    - principal
    - distinguished
    - manager
    - director
    - vice president

experience:
  maxRequiredYears: 4
  acceptWhenNotSpecified: true
  ignorePreferredQualifications: true

employmentType:
  include:
    - full-time

  exclude:
    - internship
    - co-op
    - apprenticeship
    - student program

sponsorship:
  rejectNegativeStatements: true
