name: SWE Job Watch

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Configure Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"

      - name: Find and save qualified jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GOOGLE_SHEET_ID: 1S6Ph0f5Q6J-YvHuBWG1xsFmnb_Md0eMlxeYT---Bjdg
          GOOGLE_SHEET_GID: "0"
          GOOGLE_SERVICE_ACCOUNT_KEY_FILE: ${{ runner.temp }}/google-service-account.json
        run: node dist/index.js
